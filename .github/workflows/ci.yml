name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc-release
          - os: ubuntu-latest
            preset: linux-clang-release
          - os: macos-latest
            preset: macos-clang-release

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdbus-1-dev libudev-dev libpulse-dev libasound2-dev ninja-build clang autoconf automake \
            libtool pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Prepare vcpkg
        shell: bash
        # The commit must match "builtin-baseline" in vcpkg.json; change both together.
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout e456309491fd875487bf02b8a0dca76c1b1b00cc
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c "$(cygpath -w "$VCPKG_ROOT/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} -DTRACE_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Trace-${{ matrix.os }}
          path: |
            build/${{ matrix.preset }}/Trace
            build/${{ matrix.preset }}/Trace.exe
            build/${{ matrix.preset }}/Trace.app
          if-no-files-found: warn
          retention-days: 14
